[package]
name = "codex-gitlab-code-review"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
bollard = "0.21.1"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
config = "0.15.27"
cron = "0.17.0"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "multipart", "rustls-no-provider"] }
rmcp = { version = "3.5.0", features = ["transport-streamable-http-server"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
pulldown-cmark = "0.13.4"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt-multi-thread", "time", "sync", "signal"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4"] }
flate2 = "1.1.10"
tar = "0.4.46"
zip = "8.6.0"

[dev-dependencies]
insta = "1.48.0"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
